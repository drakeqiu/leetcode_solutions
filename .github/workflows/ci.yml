name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 代码格式检查
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find . -name '*.cpp' -o -name '*.h' | head -100 | xargs clang-format --dry-run --Werror

  # 静态分析
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy

      - name: Configure CMake
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          find . -path ./build -prune -o \( -name '*.cpp' ! -name '*_test.cpp' \) -print | head -50 | xargs -r clang-tidy -p build --warnings-as-errors='*' 2>/dev/null || true

  # 多编译器构建和测试
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --verbose --output-on-failure

  # AddressSanitizer 内存检测
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake with ASan
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build

      - name: Run tests with ASan
        run: ctest --test-dir build --verbose --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
